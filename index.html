<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Masuk Ujian</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="masuk.css">
</head>
<body>

<section class="card">

  <!-- Logo Yayasan / Sekolah -->
  <div class="logo-box">
    <img src="logo.png" alt="Yayasan Pendidikan Kristen Air Kenanga" class="logo">
  </div>

  <!-- Tampilan login / input token -->
  <div id="login">
    <h1>Masuk Ujian</h1>
    <p class="sub">Masukkan token yang diberikan guru untuk membuka ujian.</p>

    <!-- Peringatan (diisi oleh JS) -->
    <div id="notice-box"></div>

    <form id="f" autocomplete="off">
      <label for="token">Token Ujian</label>
      <input id="token" type="text" autocapitalize="characters"
             spellcheck="false" placeholder="Masukkan token di sini" required>
      <p class="err" id="err" role="alert"></p>
      <button class="btn" type="submit">Masuk</button>
    </form>
  </div>

  <!-- Tampilan setelah token benar -->
  <div id="siap" hidden>
    <h1>Token Benar</h1>

    <div class="mapel-card">
      <div class="mapel-nama" id="nama"></div>
    </div>

    <p class="sub">Klik tombol di bawah untuk membuka formulir ujian:</p>

    <!-- Tombol Bersampingan -->
    <div class="btn-group">
      <button class="btn btn-secondary" id="ganti" type="button">Ganti token</button>
      <a class="btn btn-primary" id="tautan" href="#" target="_self">
        Buka formulir ujian
      </a>
    </div>
  </div>

</section>

<!-- Firebase SDK (harus sebelum firebase-config.js dan masuk.js) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<!-- Konfigurasi Firebase (isi databaseURL dll di file ini) -->
<script src="firebase-config.js"></script>

<!-- Logika halaman -->
<script src="masuk.js"></script>
</body>
</html>
