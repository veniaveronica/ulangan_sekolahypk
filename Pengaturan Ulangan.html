<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pengaturan Ujian</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="pengaturan.css">
</head>
<body>

<main>
  <div class="header-top">
    <h1>Pengaturan Ujian</h1>
    <div id="status-badge" class="status-badge status-saved" aria-live="polite">
      <span class="status-dot"></span>
      <span id="status-text">Tersimpan</span>
    </div>
  </div>
  <p class="sub">
    Isi token dan link Google Form untuk tiap kelas dan mata pelajaran.
    Klik tombol simpan di bawah untuk memperbarui database.
  </p>

  <!-- Tab navigasi kelas (diisi oleh JS) -->
  <div class="tabs" role="tablist" aria-label="Pilih kelas" id="tabs"></div>

  <!-- Grid tabel per kelas (diisi oleh JS) -->
  <div id="grid"></div>

  <!-- Tombol Simpan di Bawah -->
  <div class="bottom-actions">
    <button id="btn-simpan" class="btn btn-simpan" type="button">
      Simpan Perubahan
    </button>
  </div>
</main>

<!-- Firebase SDK (harus sebelum firebase-config.js dan pengaturan.js) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<!-- Konfigurasi Firebase -->
<script src="firebase-config.js"></script>

<!-- Logika halaman -->
<script src="pengaturan.js"></script>
</body>
</html>
